    ctx.fillStyle = L.shirt2; ctx.beginPath(); ctx.ellipse(0, -4, 7.2, 5, 0, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = L.shirt; ctx.fillRect(-7, -4.5, 14, 2);
    ctx.fillStyle = L.shirt2; rr(3, -5, 8, 2.6, 1.3); ctx.fill();
  } else if (L.hairStyle === 'quiff'){
    ctx.beginPath(); ctx.ellipse(-0.5, -5.4, 6.9, 3.6, 0, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.fillRect(-6.6, -5.6, 3.6, 6.5);
    ctx.beginPath(); ctx.ellipse(3.2, -8, 4.2, 2.4, -0.35, 0, 7); ctx.fill();
  } else if (L.hairStyle === 'curly'){
    for (const [cx, cy, r] of [[-5, -4, 3], [-2.5, -6.6, 3.2], [1, -7.3, 3], [4.2, -6, 2.6], [-6.2, -0.5, 2.6]]){ ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); }
  } else if (L.hairStyle === 'bun'){
    ctx.beginPath(); ctx.ellipse(-0.5, -3.5, 7, 5, -0.15, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4.5, -1, 3, 5, 0, 0, 7); ctx.fill();
  } else if (L.hairStyle === 'bald'){
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(1, -5.2, 2.6, 1.2, -0.3, 0, 7); ctx.fill();
    ctx.fillStyle = L.hair; ctx.beginPath(); ctx.ellipse(-4.6, 0, 2.6, 3.6, 0, 0, 7); ctx.fill();
  }
  // oreille
  ctx.fillStyle = L.skinD; ctx.beginPath(); ctx.arc(-1.5, 0.5, 1.6, 0, 7); ctx.fill();
  // yeux
  const ex = 3.6, ey = -0.5;
  if (L.mask){ ctx.fillStyle = '#111'; rr(-1, ey - 2.5, 9, 4.8, 2); ctx.fill(); }
  if (P.mouth === 'dizzy'){
    ctx.strokeStyle = L.mask ? '#fff' : '#222'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(ex, ey, 1.6, 0, 5); ctx.stroke();
  } else {
    const big = P.mouth === 'scared' || P.mouth === 'scream';
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, big ? 2 : 1.6, big ? 2.3 : 1.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(ex + 0.5, ey + (p.vy > 300 ? 0.5 : 0), big ? 0.9 : 1.1, 0, 7); ctx.fill();
    ctx.strokeStyle = L.hairStyle === 'bald' ? '#999' : L.hair; ctx.lineWidth = B.jaw ? 1.8 : 1.1; ctx.beginPath();
    if (P.mouth === 'grit'){ ctx.moveTo(ex - 1.8, ey - 3.2); ctx.lineTo(ex + 1.8, ey - 2.2); }
    else if (big){ ctx.moveTo(ex - 1.8, ey - 3.4); ctx.lineTo(ex + 1.8, ey - 4); }
    else { ctx.moveTo(ex - 1.8, ey - 2.9); ctx.lineTo(ex + 1.8, ey - 3.1); }
    ctx.stroke();
  }
  if (L.glasses){
    ctx.strokeStyle = '#222'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(ex, ey, 2.7, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex - 2.7, ey); ctx.lineTo(-1, ey - 0.6); ctx.stroke();
  }
  if (L.cheeks){ ctx.fillStyle = 'rgba(255,90,90,0.35)'; ctx.beginPath(); ctx.arc(3, 3, 1.9, 0, 7); ctx.fill(); }
  // nez
  ctx.strokeStyle = L.skinD; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(6.2, 0); ctx.lineTo(7.2, 2); ctx.lineTo(6, 2.4); ctx.stroke();
  if (L.mustache){ ctx.fillStyle = L.hair; ctx.beginPath(); ctx.ellipse(5, 3.3, 2.7, 1.1, 0.1, 0, 7); ctx.fill(); }
  // bouche
  const mx = 4.2, my = 4.2;
  ctx.fillStyle = '#5a1a1a'; ctx.strokeStyle = '#5a1a1a'; ctx.lineWidth = 1;
  if (P.mouth === 'scream' || P.mouth === 'scared'){ ctx.beginPath(); ctx.ellipse(mx, my, 1.4, P.mouth === 'scream' ? 2.2 : 1.5, 0, 0, 7); ctx.fill(); }
  else if (P.mouth === 'grit'){ ctx.fillStyle = '#fff'; ctx.fillRect(mx - 1.6, my - 0.6, 3.2, 1.4); }
  else if (P.mouth === 'dizzy'){ ctx.beginPath(); ctx.moveTo(mx - 2, my); ctx.quadraticCurveTo(mx, my - 1.5, mx + 2, my + 0.5); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(mx - 0.4, my - 1, 1.8, 0.3, Math.PI - 0.6); ctx.stroke(); }
  ctx.restore();
}

function drawTorso(L, B){
  const T = B.torso, w = B.tw;
  if (L.top === 'tank'){
    const wa = B.waist;
    // torse en V (peau), puis débardeur
    ctx.fillStyle = L.skin;
    ctx.beginPath();
    ctx.moveTo(-wa / 2, 1); ctx.lineTo(wa / 2 + 1, 1); ctx.lineTo(w / 2 + 1, -T + 2);
    ctx.quadraticCurveTo(w / 2, -T - 3, w / 2 - 5, -T - 3); ctx.lineTo(-w / 2 + 5, -T - 3);
    ctx.quadraticCurveTo(-w / 2, -T - 3, -w / 2, -T + 2); ctx.closePath(); ctx.fill();
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, L.shirt2); g.addColorStop(0.6, L.shirt); g.addColorStop(1, '#3a3a42');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-wa / 2, 1); ctx.lineTo(wa / 2 + 1, 1); ctx.lineTo(w / 2 - 1, -T + 5); ctx.lineTo(w / 2 - 5, -T - 1);
    ctx.quadraticCurveTo(2, -T + 6, -w / 2 + 5, -T - 1); ctx.lineTo(-w / 2 + 1, -T + 5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(w / 2 - 2, -T + 9); ctx.quadraticCurveTo(w / 2 - 8, -T + 13, 0, -T + 9); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    for (let k = 0; k < 3; k++){ ctx.beginPath(); ctx.moveTo(wa / 2 - 6, -T + 14 + k * 3.2); ctx.lineTo(wa / 2 - 1, -T + 14 + k * 3.2); ctx.stroke(); }
    ctx.fillStyle = '#1d1d24'; ctx.fillRect(-wa / 2, -2, wa + 1, 3);
    ctx.fillStyle = L.skinD; ctx.fillRect(-2.5, -T - 7, 8, 5.5);
  } else if (L.top === 'rainbow'){
    const cy = -T / 2 - 1, rx = w / 2, ry = T / 2 + 3;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(1.5, cy, rx, ry, 0, 0, 7); ctx.clip();
    const cols = ['#ff3b3b', '#ff9f1c', '#ffe14d', '#3ddc6a', '#3ea8ff', '#9b5cff'];
    const bh = (ry * 2) / cols.length;
    cols.forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(-rx, cy - ry + k * bh, rx * 2 + 4, bh + 0.6); });
    const g = ctx.createLinearGradient(-rx, 0, rx, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.3)'); g.addColorStop(0.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(255,255,255,0.18)');
    ctx.fillStyle = g; ctx.fillRect(-rx, cy - ry, rx * 2 + 4, ry * 2);
    ctx.restore();
    ctx.fillStyle = L.skin; ctx.beginPath(); ctx.ellipse(5, cy + ry - 1.5, 6.5, 3, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = L.skinD; ctx.beginPath(); ctx.arc(6.5, cy + ry - 0.2, 0.8, 0, 7); ctx.fill();
    ctx.fillStyle = L.skinD; ctx.fillRect(-1, -T - 5, 4, 3);
  } else {
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, L.shirt2); g.addColorStop(0.55, L.shirt); g.addColorStop(1, L.shirt);
    rr(-w / 2, -T - 3, w, T + 5, 5); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; rr(-w / 2 + 2, -T - 2, 4, T + 2, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(3, -T - 1); ctx.lineTo(3, -4); ctx.stroke();
    if (L.top === 'jacket'){
      ctx.fillStyle = L.shirt2;
      ctx.beginPath(); ctx.moveTo(-2, -T - 3); ctx.lineTo(6, -T - 3); ctx.lineTo(3, -T + 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(4, -T + 6, 2.5, 2.5);
    }
    ctx.fillStyle = '#1d1d24'; ctx.fillRect(-w / 2, -2, w, 3);
    ctx.fillStyle = '#d0d0d8'; ctx.fillRect(-2, -2.6, 4, 4.2);
    ctx.fillStyle = L.skinD; ctx.fillRect(-1, -T - 6.5, 4, 4.5);
  }
}

function drawLeg(x, y, a, B, L, back){
  const kx = x + Math.sin(a[0]) * B.legA, ky = y + Math.cos(a[0]) * B.legA;
  const ex = kx + Math.sin(a[1]) * B.legB, ey = ky + Math.cos(a[1]) * B.legB;
  ctx.lineWidth = B.legW; ctx.strokeStyle = back ? L.pantsD : L.pants;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky);
  if (!L.shorts) ctx.lineTo(ex, ey);
  ctx.stroke();
  if (L.shorts){
    ctx.strokeStyle = back ? L.skinD : L.skin; ctx.lineWidth = B.legW * 0.8;
    ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
  }
  drawShoe([ex, ey], back ? L.shoeD : L.shoe, Math.max(1, B.legW / 6.5));
}

function drawArm(x, y, a, B, L, back){
  const kx = x + Math.sin(a[0]) * B.armA, ky = y + Math.cos(a[0]) * B.armA;
  const ex = kx + Math.sin(a[1]) * B.armB, ey = ky + Math.cos(a[1]) * B.armB;
  const skin = back ? L.skinD : L.skin;
  const upper = L.top === 'tank' ? skin : (back ? L.shirt2 : L.shirt);
  const fore = (L.top === 'tank' || L.top === 'rainbow') ? skin : upper;
  ctx.lineWidth = B.armW; ctx.strokeStyle = upper;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.stroke();
  if (B.muscles){
    // deltoïde + biceps bien gonflés
    ctx.fillStyle = upper;
    ctx.beginPath(); ctx.arc(x, y + 1, B.armW * 0.72, 0, 7); ctx.fill();
    const mx = x + (kx - x) * 0.55 + Math.cos(a[0]) * 1.8, my = y + (ky - y) * 0.55 - Math.sin(a[0]) * 1.8;
    ctx.beginPath(); ctx.arc(mx, my, B.armW * 0.66, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(mx + 0.8, my - 0.8, B.armW * 0.28, 0, 7); ctx.fill();
  }
  ctx.lineWidth = B.armW * (B.muscles ? 0.86 : 0.95); ctx.strokeStyle = fore;
  ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(ex, ey, B.armW * (B.muscles ? 0.5 : 0.58), 0, 7); ctx.fill();
}

function drawHuman(p, t){
  const ch = p.ch, L = ch.look, B = ch.body;
  const P = computePose(p, t);
  const hipY = P.hip * (B.legA + B.legB) / 24.5;
  ctx.save();
  ctx.translate(p.x, p.y + R);
  const sq = p.squash * 0.6;
  ctx.scale(p.face * (1 + sq) * B.scale, (1 - sq) * B.scale);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const sh = { x: Math.sin(P.lean) * B.torso, y: hipY - Math.cos(P.lean) * B.torso };
  drawArm(sh.x - 1, sh.y, P.arms[1], B, L, true);
  drawLeg(-1, hipY, P.legs[1], B, L, true);
  ctx.save(); ctx.translate(0, hipY); ctx.rotate(P.lean);
  drawTorso(L, B);
  drawHead(p, L, B, P, t);
  ctx.restore();
  drawLeg(1, hipY, P.legs[0], B, L, false);
  drawArm(sh.x + 1, sh.y, P.arms[0], B, L, false);
  ctx.restore();
}

function drawPlayer(p, t, leader, me){
  if (p.dead || p.out) return;
  const blink = p.invuln > 0 && Math.floor(t * 12) % 2;
  ctx.save();
  if (blink) ctx.globalAlpha = 0.4;
  const ag = ctx.createRadialGradient(p.x, p.y - 8, 2, p.x, p.y - 8, 42);
  ag.addColorStop(0, hexA(p.color, 0.3)); ag.addColorStop(1, hexA(p.color, 0));
  ctx.fillStyle = ag; ctx.fillRect(p.x - 44, p.y - 52, 88, 88);
  drawHuman(p, t);
  ctx.restore();
  const headY = p.y + R - p.ch.h;
  if (p.stun > 0){
    for (let k = 0; k < 3; k++){
      const a = t * 6 + k * 2.1;
      text('★', p.x + Math.cos(a) * 12, headY + 2 + Math.sin(a) * 4, 10, '#ffd23f', 'center', '900', false);
    }
  }
  if (p.pw.shield){
    ctx.strokeStyle = `rgba(155,231,255,${0.5 + 0.3 * Math.sin(t * 6)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(p.x, p.y - 12, 26, 40, 0, 0, 7); ctx.stroke();
  }
  const icons = Object.keys(p.pw).filter(k => k !== 'shield').map(k => STATUS[k] || '').join('');
  if (icons) text(icons, p.x, p.y + R + 13, 13, '#fff', 'center', '700', false);
  if (leader){
    ctx.save(); ctx.translate(p.x, headY - 1);
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#8a6100'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, -5); ctx.lineTo(0, -12);
    ctx.lineTo(4, -5); ctx.lineTo(8, -9); ctx.lineTo(8, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (me){
    const yy = headY - (leader ? 24 : 12) + Math.sin(t * 5) * 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(p.x - 6, yy - 6); ctx.lineTo(p.x + 6, yy - 6); ctx.lineTo(p.x, yy + 2); ctx.fill();
    text('VOUS', p.x, yy - 16, 13, '#fff');
  }
}

// ---------- décor ----------
const MOUNTAINS = [0.45, 0.3, 0.18].map((sc, li) => {
  const h = [];
  for (let i = 0; i < 90; i++){
    const v = 0.5 + 0.28 * Math.sin(i * 0.19 + li * 2) + 0.14 * Math.sin(i * 0.53 + li * 5) + 0.06 * Math.sin(i * 1.7 + li);
    h.push(clamp(v, 0, 1));
  }
  return { h, s: sc, f: [0.07, 0.16, 0.3][li], col: ['#2b1c4d', '#1d1238', '#120a25'][li] };
});
const CLOUDS = [];
for (let i = 0; i < 12; i++) CLOUDS.push({ x: Math.random(), y: Math.random(), s: rand(0.6, 1.6), sp: rand(4, 14) });
let BRICK = null;
function brickPattern(){
  if (BRICK !== null) return BRICK;
  const c = document.createElement('canvas'); c.width = 96; c.height = 48;
  const b = c.getContext('2d');
  b.fillStyle = '#0d0819'; b.fillRect(0, 0, 96, 48);
  for (let row = 0; row < 2; row++) for (let i = -1; i < 3; i++){
    const x = i * 48 + (row ? 24 : 0), y = row * 24;
    b.fillStyle = `hsl(258,22%,${12 + Math.random() * 6}%)`; b.fillRect(x + 2, y + 2, 44, 20);
    b.fillStyle = 'rgba(255,255,255,0.05)'; b.fillRect(x + 2, y + 2, 44, 3);
    b.fillStyle = 'rgba(0,0,0,0.3)'; b.fillRect(x + 2, y + 19, 44, 3);
  }
  BRICK = ctx.createPattern(c, 'repeat') || '#140d26';
  return BRICK;
}

function drawPlat(pl, t){
  if (pl.type === 'g'){
    const gg = ctx.createLinearGradient(0, pl.y, 0, pl.y + 220);
    gg.addColorStop(0, '#3d2f5c'); gg.addColorStop(1, '#140d26');
    ctx.fillStyle = gg; ctx.fillRect(0, pl.y, WORLD_W, pl.h);
    ctx.fillStyle = evOn('ice') ? '#d8f6ff' : '#3f9a37'; ctx.fillRect(0, pl.y - 2, WORLD_W, 9);
    ctx.fillStyle = evOn('ice') ? '#ffffff' : '#7ddc6a'; ctx.fillRect(0, pl.y - 2, WORLD_W, 3);
    return;
  }
  let ox = 0;
  if (pl.type === 'c' && pl.crack > 0 && !pl.falling) ox = (Math.random() - 0.5) * 4 * pl.crack;
  const x = pl.x + ox, y = pl.y, w = pl.w, h = pl.h;
  ctx.save();
  if (pl.falling) ctx.globalAlpha = 0.75;
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; rr(x + 5, y + 9, w, h, 6); ctx.fill();
  let c1, c2, topc;
  if (pl.type === 'c'){ c1 = '#c4925f'; c2 = '#6d4a2c'; topc = '#e6b884'; }
  else if (pl.type === 'b'){ c1 = '#3be07a'; c2 = '#137a3d'; topc = '#b6ffcf'; }
  else if (pl.vx){ c1 = '#a4cfdd'; c2 = '#36606d'; topc = '#e3f7ff'; }
  else { c1 = '#7a6aa8'; c2 = '#342a57'; topc = '#5fc24f'; }
  if (evOn('ice') && pl.type !== 'b') topc = '#e6fbff';
  const gg = ctx.createLinearGradient(0, y, 0, y + h);
  gg.addColorStop(0, c1); gg.addColorStop(1, c2);
  rr(x, y, w, h, 6); ctx.fillStyle = gg; ctx.fill();
  if (pl.type === 'n' && !pl.vx){
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let sx = x + 18 + (pl.id * 7) % 20; sx < x + w - 6; sx += 26){ ctx.moveTo(sx, y + 5); ctx.lineTo(sx - 3, y + h); }
    ctx.stroke();
    ctx.fillStyle = topc; rr(x - 1, y - 2, w + 2, 6, 3); ctx.fill();
    ctx.fillStyle = evOn('ice') ? '#bfefff' : '#3f9a37';
    for (let k = 0; k < w / 30; k++){
      const dx = x + 8 + ((pl.id * 37 + k * 53) % Math.max(1, Math.floor(w - 16)));
      ctx.fillRect(dx, y + 2, 3, 4 + ((pl.id + k) * 13) % 7);
    }
  } else if (pl.vx){
    rr(x, y, w, 4, 2); ctx.fillStyle = topc; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let rx = x + 8; rx < x + w - 4; rx += 18){ ctx.beginPath(); ctx.arc(rx, y + 9, 1.6, 0, 7); ctx.fill(); }
    const fl = 7 + Math.random() * 6;
    for (const fx of [x + 12, x + w - 12]){
      const fg = ctx.createLinearGradient(0, y + h, 0, y + h + fl);
      fg.addColorStop(0, 'rgba(140,230,255,0.95)'); fg.addColorStop(1, 'rgba(140,230,255,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx + 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.fill();
    }
  } else if (pl.type === 'b'){
    ctx.fillStyle = topc; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 2, w / 2, 7, 0, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let k = 0; k < 3; k++){ ctx.beginPath(); ctx.arc(x + w * (0.25 + k * 0.25), y - 1, 2, 0, 7); ctx.fill(); }
    ctx.strokeStyle = '#7dff9b'; ctx.lineWidth = 2; ctx.beginPath();
    for (let sx = x + 12; sx < x + w - 8; sx += 14){ ctx.moveTo(sx, y + 14); ctx.lineTo(sx + 4, y + 20); ctx.lineTo(sx + 8, y + 14); }
    ctx.stroke();
  } else if (pl.type === 'c'){
    rr(x, y, w, 4, 2); ctx.fillStyle = topc; ctx.fill();
    if (pl.crack > 0.2){
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.beginPath();
      const m = x + w / 2;
      ctx.moveTo(m - 10, y); ctx.lineTo(m - 2, y + 7); ctx.lineTo(m - 8, y + 14);
      if (pl.crack > 0.6){ ctx.moveTo(m + w / 4, y); ctx.lineTo(m + w / 4 + 6, y + 8); ctx.lineTo(m + w / 4 - 2, y + 14); }
      ctx.stroke();
      if (!pl.falling && Math.random() < 0.25) parts.push({ x: x + Math.random() * w, y: y + h, vx: 0, vy: rand(20, 80), life: 0.5, max: 0.5, color: '#a07850', size: rand(1, 2.2), grav: 900 });
    }
  }
  ctx.restore();
}

function render(){
  const t = performance.now() / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // ciel
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const k = clamp(-cam.y / 12000, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, `hsl(${250 - 30 * k},60%,${10 - 6 * k}%)`);
  g.addColorStop(0.6, `hsl(${285 - 30 * k},50%,${17 - 9 * k}%)`);
  g.addColorStop(1, `hsl(${12 + 260 * k},${60 - 20 * k}%,${20 - 11 * k}%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  for (const s of stars){
    const y = ((s.y * VH - cam.y * s.z * 0.12) % VH + VH) % VH;
    ctx.globalAlpha = s.a * (0.55 + 0.45 * Math.sin(t * s.tw + s.p)) * (0.6 + 0.4 * k);
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x * VW, y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  // aurore boréale en altitude
  if (k > 0.12){
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, (k - 0.12) * 2) * 0.5;
    for (let i = 0; i < 3; i++){
      const ag2 = ctx.createLinearGradient(0, 0, 0, VH * 0.55);
      ag2.addColorStop(0, 'rgba(0,0,0,0)'); ag2.addColorStop(0.5, i % 2 ? 'rgba(60,255,170,0.22)' : 'rgba(150,110,255,0.22)'); ag2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ag2; ctx.beginPath(); ctx.moveTo(0, VH * 0.55);
      for (let x = 0; x <= VW + 40; x += 40) ctx.lineTo(x, VH * (0.1 + i * 0.07) + Math.sin(x * 0.004 + t * 0.4 + i * 2) * 45);
      ctx.lineTo(VW, VH * 0.55); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // lune
  {
    const mx = VW * 0.82, my = VH * 0.18 + Math.min(VH * 0.3, -cam.y * 0.01);
    const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 120);
    mg.addColorStop(0, 'rgba(255,240,220,0.35)'); mg.addColorStop(1, 'rgba(255,240,220,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - 120, my - 120, 240, 240);
    ctx.fillStyle = '#f6ecd8'; ctx.beginPath(); ctx.arc(mx, my, 34, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(180,165,140,0.5)';
    ctx.beginPath(); ctx.arc(mx - 10, my - 6, 7, 0, 7); ctx.arc(mx + 12, my + 9, 5, 0, 7); ctx.arc(mx + 4, my - 14, 3.5, 0, 7); ctx.fill();
  }
  // montagnes et volcan en parallaxe
  const bs = baseScale();
  MOUNTAINS.forEach((M, li) => {
    const base = VH * 0.8 + (-cam.y - 250) * M.f * bs;
    if (base - VH * M.s > VH) return;
    const n = M.h.length;
    let peakX = 0, peakY = 1e9;
    ctx.fillStyle = M.col;
    ctx.beginPath(); ctx.moveTo(0, base + VH * 3);
    for (let i = 0; i < n; i++){
      const x = i / (n - 1) * VW, y = base - M.h[i] * VH * M.s;
      ctx.lineTo(x, y);
      if (y < peakY){ peakY = y; peakX = x; }
    }
    ctx.lineTo(VW, base + VH * 3); ctx.closePath(); ctx.fill();
    if (li === 0){
      const vg2 = ctx.createRadialGradient(peakX, peakY, 2, peakX, peakY, 90);
      vg2.addColorStop(0, `rgba(255,120,30,${0.55 + 0.15 * Math.sin(t * 3)})`); vg2.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = vg2; ctx.fillRect(peakX - 90, peakY - 90, 180, 180);
    }
  });
  // nuages
  for (const c of CLOUDS){
    const H = VH * 1.6;
    const y = (((c.y * H - cam.y * 0.35 * bs) % H) + H) % H - VH * 0.3;
    const x = ((c.x * (VW + 400) + t * c.sp) % (VW + 400)) - 200;
    ctx.fillStyle = 'rgba(210,190,255,0.06)';
    for (let j = 0; j < 4; j++){ ctx.beginPath(); ctx.ellipse(x + j * 40 * c.s, y + Math.sin(j * 2) * 8, 60 * c.s, 22 * c.s, 0, 0, 7); ctx.fill(); }
  }

  // monde
  const sc = baseScale() * cam.zoom * DPR;
  const shx = (Math.random() - 0.5) * shake * DPR * 2, shy = (Math.random() - 0.5) * shake * DPR * 2;
  ctx.setTransform(sc, 0, 0, sc, cv.width / 2 - 500 * sc + shx, cv.height / 2 - cam.y * sc + shy);
  const top = cam.y - cv.height / (2 * sc) - 20, bot = cam.y + cv.height / (2 * sc) + 20;

  // repères d'altitude
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2; ctx.setLineDash([12, 14]);
  const step = 25 * UNITS_PER_M;
  for (let y = Math.floor(top / step) * step; y < bot; y += step){
    if (y >= 0) continue;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
    text(Math.round(-y / UNITS_PER_M) + ' m', 12, y - 12, 16, 'rgba(255,255,255,0.25)', 'left', '700', false);
  }
  ctx.setLineDash([]);

  // murs de la tour en briques
  ctx.fillStyle = brickPattern();
  ctx.fillRect(-4000, top, 4000, bot - top); ctx.fillRect(WORLD_W, top, 4000, bot - top);
  let wg = ctx.createLinearGradient(-70, 0, 0, 0);
  wg.addColorStop(0, 'rgba(0,0,0,0)'); wg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = wg; ctx.fillRect(-70, top, 70, bot - top);
  wg = ctx.createLinearGradient(WORLD_W, 0, WORLD_W + 70, 0);
  wg.addColorStop(0, 'rgba(0,0,0,0.65)'); wg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = wg; ctx.fillRect(WORLD_W, top, 70, bot - top);
  ctx.strokeStyle = 'rgba(170,130,255,0.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(0, bot); ctx.moveTo(WORLD_W, top); ctx.lineTo(WORLD_W, bot); ctx.stroke();

  // plateformes
  for (const pl of plats){
    if (pl.y > bot || pl.y + pl.h < top) continue;
    drawPlat(pl, t);
  }

  // pièces
  const drawCoin = (cx, cy, ph) => {
    const w = Math.max(0.15, Math.abs(Math.cos(t * 4 + ph)));
    ctx.beginPath(); ctx.ellipse(cx, cy, 9 * w, 9, 0, 0, 7);
    ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#b8860b'; ctx.stroke();
  };
  for (const c of coins){ if (c.y < bot && c.y > top) drawCoin(c.plat.x + c.off, c.y, c.t); }
  for (const c of fcoins){ if (c.y < bot && c.y > top) drawCoin(c.x, c.y, c.x * 0.1); }

  // objets
  for (const it of items){
    const iy = it.y + Math.sin(it.t * 3) * 5;
    if (iy > bot || iy < top) continue;
    ctx.save(); ctx.translate(it.x, iy);
    if (it.type === 'gem'){
      ctx.shadowColor = '#c77dff'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(11, -3); ctx.lineTo(0, 14); ctx.lineTo(-11, -3); ctx.closePath();
      ctx.fillStyle = '#c77dff'; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(5, -3); ctx.lineTo(0, 4); ctx.lineTo(-5, -3); ctx.closePath();
      ctx.fillStyle = '#f0d9ff'; ctx.fill();
    } else if (it.type === 'pw'){
      const hue = (t * 120 + it.x) % 360;
      ctx.rotate(Math.sin(t * 2 + it.x) * 0.15);
      ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 18;
      rr(-14, -14, 28, 28, 7); ctx.fillStyle = `hsl(${hue},85%,55%)`; ctx.fill();
      ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      text('?', 0, 1, 22, '#fff', 'center', '900', true);
    } else {
      ctx.shadowColor = '#ff4d4d'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fillStyle = '#ff4d4d'; ctx.fill();
      ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      text('✂', 0, 1, 20, '#fff', 'center', '800', false);
    }
    ctx.restore();
  }

  // élastique (corde tressée attachée au harnais)
  const [a, b] = players;
  if (!a.dead && !b.dead && !a.out && !b.out){
    const ay = a.y + R - a.ch.hipH, by = b.y + R - b.ch.hipH;
    if (cutTimer <= 0){
      const rest = evOn('spring') ? 80 : REST_LEN;
      const d = Math.hypot(b.x - a.x, by - ay);
      const st = clamp((d - rest) / 250, 0, 1);
      const sag = Math.max(0, rest - d) * 0.7 + 10 * (1 - st);
      const mx = (a.x + b.x) / 2, my = (ay + by) / 2 + sag;
      const col = evOn('spring') ? `hsl(${60 + Math.sin(t * 30) * 30},100%,65%)` : `hsl(${100 - 100 * st},90%,58%)`;
      const w = 6 - 2.5 * st;
      ctx.lineCap = 'round';
      const path = () => { ctx.beginPath(); ctx.moveTo(a.x, ay); ctx.quadraticCurveTo(mx, my, b.x, by); };
      if (st > 0.5){ ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 14 * st; }
      path(); ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = w + 2.5; ctx.stroke();
      path(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
      if (st > 0.5) ctx.restore();
      ctx.setLineDash([3, 5]); ctx.lineDashOffset = -t * 20;
      path(); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = w * 0.45; ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = 'rgba(180,255,110,0.6)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (const p of players){ ctx.beginPath(); ctx.moveTo(p.x, p.y - 9); ctx.quadraticCurveTo(p.x - p.face * 10, p.y + 4, p.x - p.face * 16, p.y + 12); ctx.stroke(); }
    }
  }

  // joueurs
  const leader = a.score === b.score ? -1 : (a.score > b.score ? 0 : 1);
  const mine = myIndex();
  for (const p of players) drawPlayer(p, t, leader === p.i && state !== 'title' && state !== 'lobby', p.i === mine && state !== 'lobby');

  // boules de feu
  for (const f of fireballs){
    if (f.warn > 0){
      const pulse = 0.5 + 0.5 * Math.sin(t * 25);
      ctx.globalAlpha = 0.6 + 0.4 * pulse;
      ctx.beginPath(); ctx.arc(f.x, lava.y - 24, 14, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
      text('!', f.x, lava.y - 23, 22, '#ff3b1c', 'center', '900', false);
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.save(); ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, 7); ctx.fillStyle = '#ff7b1c'; ctx.fill();
    ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 7); ctx.fillStyle = '#ffe08a'; ctx.fill();
    ctx.restore();
  }

  // particules
  for (const q of parts){
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // lave
  if (lava.y < bot + 420){
    const wy = x => lava.y + Math.sin(x * 0.02 + t * 3) * 6 + Math.sin(x * 0.05 - t * 2) * 3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createLinearGradient(0, lava.y - 400, 0, lava.y);
    gl.addColorStop(0, 'rgba(255,80,0,0)'); gl.addColorStop(1, `rgba(255,90,10,${0.42 + 0.06 * Math.sin(t * 4)})`);
    ctx.fillStyle = gl; ctx.fillRect(-4000, lava.y - 400, 9000, 400);
    ctx.restore();
    const lg = ctx.createLinearGradient(0, lava.y, 0, lava.y + 260);
    lg.addColorStop(0, '#fff1a8'); lg.addColorStop(0.05, '#ffb02e'); lg.addColorStop(0.25, '#ff4d12'); lg.addColorStop(1, '#5a0505');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(-4000, lava.y + 3000);
    for (let x = -1000; x <= 2000; x += 20) ctx.lineTo(x, wy(x));
    ctx.lineTo(5000, lava.y + 3000); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(90,12,0,0.45)';
    for (let i = 0; i < 16; i++){
      const cx = (((i * 137 + t * (18 + i * 3) * (i % 2 ? 1 : -1)) % 1500) + 1500) % 1500 - 250;
      ctx.beginPath(); ctx.ellipse(cx, lava.y + 28 + (i % 4) * 26, 30 + (i % 3) * 16, 4 + (i % 2) * 3, 0, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,245,190,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); for (let x = -1000; x <= 2000; x += 20){ if (x === -1000) ctx.moveTo(x, wy(x)); else ctx.lineTo(x, wy(x)); } ctx.stroke();
  }

  // textes flottants
  for (const tx of texts){
    ctx.globalAlpha = clamp(tx.life / 0.4, 0, 1);
    text(tx.txt, tx.x, tx.y, tx.size, tx.color);
  }
  ctx.globalAlpha = 1;

  // ----- interface -----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  {
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    if (flash){ ctx.globalAlpha = clamp(flash.t / 0.35, 0, 1) * 0.4; ctx.fillStyle = flash.c; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
  }
  const u = clamp(Math.min(VW / 1280, VH / 760), 0.6, 1.6);
  if (evOn('reverse')){ ctx.fillStyle = `rgba(255,120,220,${0.06 + 0.04 * Math.sin(t * 8)})`; ctx.fillRect(0, 0, VW, VH); }
  if (state !== 'title' && state !== 'lobby' && state !== 'select') drawHUD(u, t);
  if (state === 'select') drawSelect(u, t);
  if (banner){
    ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1);
    const pop = 1 + Math.max(0, (banner.t - banner.max + 0.15)) * 2;
    text(banner.txt, VW / 2, VH * 0.27, 34 * u * pop, banner.color);
    if (banner.sub) text(banner.sub, VW / 2, VH * 0.27 + 36 * u, 19 * u, '#fff', 'center', '700');
    ctx.globalAlpha = 1;
  }
  if (state === 'countdown'){
    const n = Math.ceil(countdown), f = countdown - Math.floor(countdown);
    text(String(n), VW / 2, VH * 0.45, (90 + 60 * f) * u, '#fff');
  }
  if (state === 'title') drawTitle(u, t);
  if (state === 'lobby') drawLobby(u, t);
  if (state === 'pause'){
    ctx.fillStyle = 'rgba(5,3,20,0.6)'; ctx.fillRect(0, 0, VW, VH);
    text('PAUSE', VW / 2, VH * 0.42, 70 * u, '#fff');
    text('Échap ou P : reprendre   ·   Retour arrière : quitter vers le menu', VW / 2, VH * 0.52, 20 * u, '#ccc', 'center', '600');
  }
  if (state === 'end') drawEnd(u, t);
  if (!document.hasFocus() && !joinOpen){
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; rr(VW / 2 - 300 * u, VH - 70 * u, 600 * u, 46 * u, 14 * u); ctx.fill();
    text('👆 Cliquez dans la page pour activer le clavier', VW / 2, VH - 47 * u, 20 * u, '#ffd23f');
  }
}

function drawHearts(x, y, n, align, u){
  const s = 20 * u;
  for (let i = 0; i < HEARTS; i++){
    const hx = align === 'left' ? x + i * s * 1.15 : x - (HEARTS - 1 - i) * s * 1.15 - s;
    text('♥', hx + s / 2, y, s * 1.1, i < n ? '#ff4d6d' : 'rgba(255,255,255,0.2)', 'center', '900', i < n);
  }
}

function drawHUD(u, t){
  const [a, b] = players;
  const pad = 22 * u;
  const online = !!net;
  const block = (p, x, align, keyName, powKey) => {
    const me = p.i === myIndex();
    text(p.ch.icon + ' ' + p.name + (me ? ' (VOUS)' : ''), x, pad + 12 * u, 18 * u, p.color, align);
    drawHearts(align === 'left' ? x : x, pad + 38 * u, p.hearts, align, u);
    text(String(p.score), x, pad + 74 * u, 44 * u, '#fff', align);
    const w = 130 * u, h = 9 * u;
    const bx = align === 'left' ? x : x - w, by = pad + 106 * u;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(bx, by, w, h, h / 2); ctx.fill();
    const f = cutTimer > 0 ? 0 : clamp(1 - p.yankCD / YANK_CD, 0, 1);
    ctx.fillStyle = f >= 1 ? p.color : 'rgba(255,255,255,0.35)'; rr(bx, by, Math.max(h, w * f), h, h / 2); ctx.fill();
    text(keyName, align === 'left' ? bx : bx + w, by + 22 * u, 13 * u, 'rgba(255,255,255,0.75)', align, '700');
    // case du pouvoir stocké
    const bs2 = 50 * u, ix = align === 'left' ? x + 150 * u : x - 150 * u - bs2, iy = pad + 44 * u;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ix, iy, bs2, bs2, 10 * u); ctx.fill();
    ctx.strokeStyle = p.item ? POWERS[p.item].color : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2.5 * u; ctx.stroke();
    const vals = Object.values(POWERS);
    const ic = p.roll > 0 ? vals[Math.floor(t * 14) % vals.length].icon : (p.item ? POWERS[p.item].icon : '');
    if (ic) text(ic, ix + bs2 / 2, iy + bs2 / 2 + 1, 28 * u, '#fff', 'center', '700', false);
    text(powKey, ix + bs2 / 2, iy + bs2 + 12 * u, 12 * u, 'rgba(255,255,255,0.6)', 'center', '700');
    const st = Object.entries(p.pw).map(([k, v]) => (STATUS[k] || '') + Math.ceil(v)).join('   ');
    if (st) text(st, align === 'left' ? bx : bx + w, by + 46 * u, 16 * u, '#fff', align, '700');
  };
  block(a, pad, 'left', 'TIRER E · RAMENER R', 'F');
  block(b, VW - pad, 'right', online ? 'TIRER E · RAMENER R' : 'TIRER Entrée · RAMENER Shift', online ? 'F' : 'Ctrl / !');

  const sec = Math.ceil(timeLeft), mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, '0');
  const urgent = state === 'play' && timeLeft <= 10;
  const sz = (urgent ? 50 + 8 * Math.abs(Math.sin(t * 6)) : 44) * u;
  text(`${mm}:${ss}`, VW / 2, pad + 26 * u, sz, urgent ? '#ff5a5a' : '#fff');
  const alive = players.filter(p => !p.dead);
  const hy = alive.length ? Math.min(...alive.map(p => p.y)) : 0;
  const lavaGap = Math.max(0, Math.round((lava.y - hy) / UNITS_PER_M));
  text(`${Math.max(0, Math.round(-hy / UNITS_PER_M))} m   ·   lave à ${lavaGap} m`, VW / 2, pad + 62 * u, 16 * u, lavaGap < 6 ? '#ff8a5a' : 'rgba(255,255,255,0.8)', 'center', '700');
  let yy = pad + 90 * u;
  if (cutTimer > 0){ text(`✂ élastique coupé : ${Math.ceil(cutTimer)} s`, VW / 2, yy, 18 * u, '#ff7b7b'); yy += 26 * u; }
  if (evt && EVENTS[evt.type]){ const E = EVENTS[evt.type]; text(`${E.name} : ${Math.ceil(evt.t)} s`, VW / 2, yy, 18 * u, E.color); }
}

function panel(x, y, w, h, u){
  ctx.fillStyle = 'rgba(8,5,25,0.85)'; rr(x, y, w, h, 24 * u); ctx.fill();
  ctx.strokeStyle = 'rgba(180,140,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawTitle(u, t){
  const w = Math.min(VW - 30, 940 * u), h = Math.min(VH * 0.82, 640 * u);
  const x = (VW - w) / 2, y = VH * 0.025;
  panel(x, y, w, h, u);
  const cx = VW / 2;
  let yy = y + 50 * u;
  const lgr = ctx.createLinearGradient(cx - 220 * u, 0, cx + 220 * u, 0);
  lgr.addColorStop(0, '#ff5d8f'); lgr.addColorStop(0.5, '#ffd23f'); lgr.addColorStop(1, '#3ec7ff');
  ctx.save(); ctx.shadowColor = '#ff8a3a'; ctx.shadowBlur = 25 * u;
  text('ÉLASTIQUE', cx, yy + Math.sin(t * 2) * 3 * u, 66 * u, lgr);
  ctx.restore();
  yy += 42 * u;
  text('Coopérez pour monter. Trahissez pour gagner.', cx, yy, 20 * u, '#fff', 'center', '600');
  yy += 44 * u;
  const colL = cx - w * 0.24, colR = cx + w * 0.24;
  text('JOUEUR 1', colL, yy, 20 * u, '#ff5d8f'); text('JOUEUR 2', colR, yy, 20 * u, '#3ec7ff');
  yy += 27 * u;
  const lines = [
    ['Z Q S D : bouger / sauter', 'Flèches : bouger / sauter'],
    ['S au sol : s\'agripper', '↓ au sol : s\'agripper'],
    ['E : tirer l\'autre  ·  R : se ramener', 'Entrée : tirer  ·  Shift droit : se ramener'],
    ['F : utiliser le pouvoir', 'Ctrl droit ou ! : utiliser le pouvoir'],
  ];
  for (const [l, r] of lines){
    text(l, colL, yy, 16 * u, '#eee', 'center', '600', false);
    text(r, colR, yy, 16 * u, '#eee', 'center', '600', false);
    yy += 23 * u;
  }
  text('(WASD en QWERTY · en ligne, chacun peut utiliser les deux)', cx, yy, 12 * u, 'rgba(255,255,255,0.45)', 'center', '600', false);
  yy += 30 * u;
  const rules = [
    '3 vies chacun et la lave monte. Plus de vies = PERDU.',
    'Une pièce compte pour celui qui la touche. Gemme = 5. Le plus riche gagne au bout de 3 min.',
    'TIRER ramène l\'autre vers vous (sauf s\'il est agrippé).  SE RAMENER vous propulse vers lui.',
    '🧗 Suspendu dans le vide ? Maintenez SAUT pour grimper à la corde.',
    '🔪 Trahison : l\'autre tombe dans la lave juste après votre TIRER → +3 pièces.',
    '❓ Boîte = un pouvoir stocké, à déclencher quand vous voulez  ·  ☄ boules de feu  ·  plateformes fragiles',
  ];
  for (const r of rules){ text(r, cx, yy, 15 * u, 'rgba(255,255,255,0.88)', 'center', '600', false); yy += 23 * u; }
  yy += 16 * u;
  const pulse = 0.6 + 0.4 * Math.sin(t * 4);
  const opts = [
    ['[1] ou ENTRÉE', 'Jouer à deux sur ce PC', '#ffd23f'],
    ['[2]', 'Créer une partie en ligne', '#b6ff6a'],
    ['[3]', 'Rejoindre une partie en ligne', '#3ec7ff'],
  ];
  menuRects = [];
  const acts = [startLocal, hostOnline, openJoin];
  for (const [kk, lbl, col] of opts){
    menuRects.push({ x: cx - 200 * u, y: yy - 15 * u, w: 520 * u, h: 30 * u, act: acts[menuRects.length] });
    ctx.globalAlpha = kk.startsWith('[1]') ? pulse : 1;
    text(kk, cx - 16 * u, yy, 22 * u, col, 'right');
    text(lbl, cx, yy, 22 * u, '#fff', 'left');
    ctx.globalAlpha = 1;
    yy += 32 * u;
  }
  text('Touches ou clic souris · Vous pouvez tester les contrôles en bas pendant ce temps !', cx, VH - 20 * u, 14 * u, 'rgba(255,255,255,0.6)', 'center', '600');
}

function wrapText(str, x, y, maxW, size, color){
  const font = `600 ${size}px "Segoe UI", "Segoe UI Emoji", system-ui, sans-serif`;
  ctx.font = font;
  const words = str.split(' ');
  let line = '', yy = y;
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ text(line, x, yy, size, color, 'center', '600', false); ctx.font = font; line = w; yy += size * 1.25; }
    else line = test;
  }
  if (line) text(line, x, yy, size, color, 'center', '600', false);
}

function drawSelect(u, t){
  ctx.fillStyle = 'rgba(6,4,18,0.88)'; ctx.fillRect(0, 0, VW, VH);
  text('CHOISISSEZ VOTRE PERSONNAGE', VW / 2, 46 * u, 38 * u, '#ffd23f');
  const n = CHARS.length;
  const cols = VW / u > 1180 ? n : 3;
  const rows = Math.ceil(n / cols);
  const gap = 14 * u;
  const cw = Math.min(200 * u, (VW - 40 - gap * (cols - 1)) / cols);
  const chh = Math.min(340 * u, (VH - 180 * u - gap * (rows - 1)) / rows);
  const x0 = (VW - (cols * cw + (cols - 1) * gap)) / 2, y0 = 84 * u;
  const me = myIndex();
  const curCol = ['#ff5d8f', '#3ec7ff'];
  CHARS.forEach((C, k) => {
    const cx = x0 + (k % cols) * (cw + gap), cy = y0 + Math.floor(k / cols) * (chh + gap);
    const on = [0, 1].filter(i => sel[i].c === k);
    const taken = [0, 1].some(i => sel[i].ready && sel[i].c === k);
    ctx.fillStyle = on.length ? hexA(C.color, 0.16) : 'rgba(255,255,255,0.05)';
    rr(cx, cy, cw, chh, 16 * u); ctx.fill();
    on.forEach((i, j) => {
      ctx.strokeStyle = curCol[i]; ctx.lineWidth = 4 * u;
      rr(cx + j * 6 * u, cy + j * 6 * u, cw - j * 12 * u, chh - j * 12 * u, 16 * u); ctx.stroke();
      const lbl = me < 0 ? 'J' + (i + 1) : (i === me ? 'VOUS' : 'POTE');
      text(lbl + (sel[i].ready ? ' ✓' : ''), i === 0 ? cx + 10 * u : cx + cw - 10 * u, cy + 18 * u, 15 * u, curCol[i], i === 0 ? 'left' : 'right');
    });
    // aperçu animé du perso
    const sc2 = Math.min(cw / 50, chh / 140);
    const fake = { i:-1, preview:true, ch:C, x:0, y:-R, vx: on.length && !taken ? 230 : 0, vy:0, face:1, squash:0, onGround:true,
                   anim: t * 7 + k, stun:0, pw:{}, anchored:false, climbing:false };
    ctx.save();
    ctx.setTransform(DPR * sc2, 0, 0, DPR * sc2, (cx + cw / 2) * DPR, (cy + chh * 0.56) * DPR);
    const sg = ctx.createRadialGradient(0, -25, 2, 0, -25, 45);
    sg.addColorStop(0, hexA(C.color, on.length ? 0.4 : 0.15)); sg.addColorStop(1, hexA(C.color, 0));
    ctx.fillStyle = sg; ctx.fillRect(-50, -80, 100, 100);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 4, 0, 0, 7); ctx.fill();
    drawHuman(fake, t);
    ctx.restore();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (taken && !on.some(i => sel[i].ready && sel[i].c === k && i === on[0])) {}
    text(C.icon + ' ' + C.name, cx + cw / 2, cy + chh * 0.66, 22 * u, C.color);
    text(C.title, cx + cw / 2, cy + chh * 0.66 + 24 * u, 13 * u, 'rgba(255,255,255,0.7)', 'center', '600', false);
    wrapText(C.desc, cx + cw / 2, cy + chh * 0.66 + 50 * u, cw - 18 * u, 14 * u, '#fff');
  });
  const help = !net
    ? 'J1 : Q / D choisir · Z ou E valider · S annuler        J2 : ← / → choisir · ↑ ou Entrée valider · ↓ annuler'
    : '← / → (ou Q / D) : choisir   ·   Entrée, E ou Z : valider   ·   ↓ ou S : annuler';
  text(help, VW / 2, VH - 52 * u, 15 * u, 'rgba(255,255,255,0.8)', 'center', '600');
  text('Échap : retour au menu', VW / 2, VH - 26 * u, 13 * u, 'rgba(255,255,255,0.45)', 'center', '600');
  if (sel[0].ready && sel[1].ready) text('C\'EST PARTI !', VW / 2, VH * 0.5, 60 * u, '#ffd23f');
}

function drawLobby(u, t){
  if (!net) return;
  const w = Math.min(VW - 30, 720 * u), h = 330 * u;
  const x = (VW - w) / 2, y = VH * 0.12;
  panel(x, y, w, h, u);
  const cx = VW / 2;
  if (net.role === 'host'){
    text('PARTIE EN LIGNE', cx, y + 44 * u, 34 * u, '#b6ff6a');
    text('Envoyez ce code à votre pote :', cx, y + 92 * u, 19 * u, '#fff', 'center', '600');
    text(net.code.split('').join(' '), cx, y + 150 * u, 64 * u, '#ffd23f');
    if (net.copied) text('(déjà copié, faites juste Ctrl+V dans Discord)', cx, y + 196 * u, 14 * u, 'rgba(255,255,255,0.6)', 'center', '600');
    text('Il ouvre le jeu, appuie sur 3 et tape ce code.', cx, y + 222 * u, 16 * u, 'rgba(255,255,255,0.8)', 'center', '600');
  } else {
    text('REJOINDRE', cx, y + 44 * u, 34 * u, '#3ec7ff');
    text('Code : ' + net.code, cx, y + 120 * u, 44 * u, '#ffd23f');
  }
  const dots = net.failed ? '' : '.'.repeat(1 + Math.floor(t * 2) % 3);
  text(net.status.replace(/…$/, '') + (net.status.endsWith('…') ? dots : ''), cx, y + 262 * u, 17 * u, net.failed ? '#ff7b7b' : '#fff', 'center', '700');
  text('Échap : retour au menu', cx, y + 300 * u, 14 * u, 'rgba(255,255,255,0.5)', 'center', '600');
}

function drawEnd(u, t){
  ctx.fillStyle = `rgba(5,3,20,${Math.min(0.72, endT)})`; ctx.fillRect(0, 0, VW, VH);
  const [a, b] = players;
  const cx = VW / 2;
  const info = endInfo || { win:-1, reason:'time', quip:'' };
  if (info.win < 0) text('ÉGALITÉ !', cx, VH * 0.24, 80 * u, '#fff');
  else {
    const w = players[info.win], l = players[1 - info.win];
    const me = myIndex();
    const title = me < 0 ? w.name + ' GAGNE !' : (me === info.win ? 'VICTOIRE !' : 'DÉFAITE…');
    text(title, cx, VH * 0.24, (80 + 4 * Math.sin(t * 5)) * u, w.color);
    const why = info.reason === 'ko' ? `${l.name} n'a plus de vies 🔥` : 'Temps écoulé : le plus riche l\'emporte 💰';
    text(why, cx, VH * 0.33, 22 * u, '#fff', 'center', '700');
  }
  text(String(a.score), cx - 120 * u, VH * 0.46, 64 * u, a.color);
  text('—', cx, VH * 0.46, 40 * u, '#fff');
  text(String(b.score), cx + 120 * u, VH * 0.46, 64 * u, b.color);
  text(`Altitude max : ${maxAlt} m`, cx, VH * 0.56, 20 * u, 'rgba(255,255,255,0.8)', 'center', '600');
  if (info.quip) text('« ' + info.quip + ' »', cx, VH * 0.63, 20 * u, '#ffd23f', 'center', '600');
  if (endT > 1){
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
    text('ENTRÉE pour la revanche', cx, VH * 0.74, 28 * u, '#fff');
    ctx.globalAlpha = 1;
    text('C : changer de perso   ·   Retour arrière : menu principal', cx, VH * 0.8, 15 * u, 'rgba(255,255,255,0.6)', 'center', '600');
  }
}

// ---------- souris / focus ----------
let menuRects = [];
const inRect = (e, m) => e.clientX >= m.x && e.clientX <= m.x + m.w && e.clientY >= m.y && e.clientY <= m.y + m.h;
cv.addEventListener('mousedown', e => {
  window.focus(); initAudio();
  if (state !== 'title' || joinOpen) return;
  for (const m of menuRects) if (inRect(e, m)){ m.act(); return; }
});
cv.addEventListener('mousemove', e => {
  cv.style.cursor = state === 'title' && menuRects.some(m => inRect(e, m)) ? 'pointer' : 'default';
});

// ---------- démarrage ----------
window.focus();
initGame();
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  if (isHost() && state !== 'lobby' && net.conn && net.conn.open){
    sendAcc += dt;
    if (sendAcc >= 1 / 30){ sendAcc = 0; try { net.conn.send(snapshot()); } catch(e) {} }
  }
  render();
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
